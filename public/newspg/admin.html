<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin | Upload Wildlife News</title>
    <link rel="stylesheet" href="news.css">
</head>
<body>

<header class="page-header">
    <h1>Admin Panel – Publish Wildlife News</h1>
</header>

<section class="content">
    <form action="/admin/add-news" method="post" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="News Title" required>
        <input type="text" name="location" placeholder="State / National Park" required>
        <textarea name="content" rows="6" placeholder="News Article / Blog" required></textarea>
        <label for="">
        <input type="file" name="image" required>
        <button onclick="submitNews()">Publish News</button>
    </form>
</section>
<script src="loginpg4.js"></script>
 
</body>
</html>
